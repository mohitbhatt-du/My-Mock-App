<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IT Officer Mains: Day 4</title>
    <!-- Add Lucide Icons for UI -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-panel: #283548;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --status-answered: #10b981; /* Green */
            --status-unanswered: #ef4444; /* Red */
            --status-notvisited: #64748b; /* Gray */
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent body scrolling */
        }

        /* --- SETUP SCREEN --- */
        #setup-screen {
            max-width: 500px;
            margin: 10vh auto;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); }

        /* --- EXAM UI (Desktop Grid) --- */
        #quiz-screen {
            display: none;
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr;
            grid-template-columns: 1fr 300px;
            grid-template-areas: 
                "header header"
                "main panel";
        }

        .exam-header {
            grid-area: header;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .timer { font-size: 1.2rem; font-weight: bold; color: var(--status-unanswered); }

        /* Main Question Area */
        .main-area {
            grid-area: main;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .question-text { font-size: 1.1rem; margin-bottom: 20px; }

        .svg-container { background: #fff; padding: 10px; border-radius: 8px; overflow-x: auto; margin-bottom: 15px;}
        pre { background: var(--bg-main); padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border-color); }
        .match-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .match-table th, .match-table td { border: 1px solid var(--border-color); padding: 8px; }

        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-label {
            background: var(--bg-card);
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-label:hover { border-color: var(--accent-blue); }
        input[type="radio"] { transform: scale(1.3); margin: 0; }

        .action-bar {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* Side Panel (Question Palette) */
        .side-panel {
            grid-area: panel;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; text-align: center; }
        
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border-color);
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-box { width: 15px; height: 15px; border-radius: 3px; }

        .palette-grid {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            overflow-y: auto;
        }

        .palette-btn {
            aspect-ratio: 1;
            border-radius: 4px;
            border: none;
            background: var(--status-notvisited);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .palette-btn.answered { background: var(--status-answered); }
        .palette-btn.unanswered { background: var(--status-unanswered); }
        .palette-btn.active { border: 2px solid white; transform: scale(1.1); }

        .submit-section { padding: 15px; margin-top: auto; border-top: 1px solid var(--border-color); }
        .submit-section .btn { width: 100%; background: var(--status-answered); }

        /* Mobile Toggle Button */
        #mobile-palette-toggle { display: none; }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            #quiz-screen {
                display: flex;
                flex-direction: column;
            }
            .side-panel {
                position: fixed;
                top: 60px;
                right: -100%;
                width: 250px;
                height: calc(100vh - 60px);
                z-index: 1000;
                transition: right 0.3s ease;
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            }
            .side-panel.open { right: 0; }
            #mobile-palette-toggle {
                display: flex;
                align-items: center;
                gap: 5px;
                background: var(--bg-panel);
                border: 1px solid var(--border-color);
                color: white;
                padding: 5px 10px;
                border-radius: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <h2>IT Officer Mains: Day 4</h2>
        <select id="timer-select">
            <option value="20">20 Minutes</option>
            <option value="35">35 Minutes</option>
            <option value="45" selected>45 Minutes</option>
            <option value="60">60 Minutes</option>
        </select>
        <button class="btn" style="width:100%" onclick="startQuiz()">Start Exam</button>
    </div>

    <!-- EXAM SCREEN -->
    <div id="quiz-screen" style="display: none;">
        <!-- Header -->
        <div class="exam-header">
            <div><strong>IT-Mains Hub</strong></div>
            <div class="timer"><i data-lucide="clock" style="width: 18px; vertical-align: middle;"></i> <span id="timer-display">45:00</span></div>
            <button id="mobile-palette-toggle" onclick="toggleMobilePalette()">
                <i data-lucide="grid"></i> Grid
            </button>
        </div>

        <!-- Main Question Area -->
        <div class="main-area">
            <div class="question-header">
                <span id="q-number-title">Question 1</span>
                <span id="q-topic-title" style="color: var(--text-muted);">Topic</span>
            </div>
            
            <div id="question-content">
                <!-- Question injected via JS -->
            </div>

            <div class="action-bar">
                <button class="btn btn-outline" onclick="prevQuestion()"><i data-lucide="chevron-left"></i> Prev</button>
                <button class="btn btn-outline" onclick="clearResponse()" style="margin: 0 auto;">Clear Response</button>
                <button class="btn" onclick="nextQuestion()">Next <i data-lucide="chevron-right"></i></button>
            </div>
        </div>

        <!-- Side Panel (Palette) -->
        <div class="side-panel" id="side-panel">
            <div class="panel-header">Question Palette</div>
            <div class="legend">
                <div class="legend-item"><div class="legend-box" style="background: var(--status-answered)"></div> Answered</div>
                <div class="legend-item"><div class="legend-box" style="background: var(--status-unanswered)"></div> Not Answered</div>
                <div class="legend-item"><div class="legend-box" style="background: var(--status-notvisited)"></div> Not Visited</div>
            </div>
            <div class="palette-grid" id="palette-grid">
                <!-- Buttons injected via JS -->
            </div>
            <div class="submit-section">
                <button class="btn" onclick="submitQuiz()">Submit Final Exam</button>
            </div>
        </div>
    </div>

<script>
    // --- Initialize Lucide Icons ---
    lucide.createIcons();

    // --- QUESTION DATABASE (Demo 10 Questions, I will provide the other 40 as JSON!) ---
    const questions = [
        {
            id: 1, topic: "DBMS", text: "Based on the ER diagram provided below, which of the following is true about the relationship between 'Student' and 'Course'?",
            svg: `<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="50" width="100" height="50" fill="white" stroke="black" stroke-width="2"/><text x="70" y="80" text-anchor="middle" fill="black" font-weight="bold">STUDENT</text><path d="M 170 75 L 220 50 L 270 75 L 220 100 Z" fill="white" stroke="black" stroke-width="2"/><text x="220" y="80" text-anchor="middle" fill="black">ENROLLS</text><rect x="320" y="50" width="100" height="50" fill="white" stroke="black" stroke-width="2"/><text x="370" y="80" text-anchor="middle" fill="black" font-weight="bold">COURSE</text><line x1="120" y1="75" x2="170" y2="75" stroke="black" stroke-width="2"/><text x="145" y="70" fill="black">M</text><line x1="270" y1="75" x2="320" y2="75" stroke="black" stroke-width="2"/><text x="295" y="70" fill="black">N</text></svg>`,
            options: ["A) One student can enroll in only one course.", "B) A course can have only one student enrolled.", "C) Many students can enroll in many courses.", "D) The relationship requires a weak entity."], correct: 2
        },
        {
            id: 2, topic: "DBMS", text: "Match the Database Normal Forms (List I) with their corresponding rules (List II):",
            matchTable: `<tr><th>List I (Normal Form)</th><th>List II (Rule)</th></tr><tr><td>P. 1NF</td><td>1. Removes transitive dependency</td></tr><tr><td>Q. 2NF</td><td>2. Every determinant is a candidate key</td></tr><tr><td>R. 3NF</td><td>3. Values in a column must be atomic</td></tr><tr><td>S. BCNF</td><td>4. Removes partial dependency</td></tr>`,
            options: ["A) P-3, Q-4, R-1, S-2", "B) P-4, Q-3, R-2, S-1", "C) P-3, Q-1, R-4, S-2", "D) P-1, Q-2, R-3, S-4"], correct: 0
        },
        {
            id: 3, topic: "Python Programming", text: "What will be the output of the following Python snippet?",
            code: `def calc(x, y=[]):\n    y.append(x)\n    return y\n\nprint(calc(1))\nprint(calc(2, []))\nprint(calc(3))`,
            options: ["A) [1] \\n [2] \\n [3]", "B) [1] \\n [2] \\n [1, 3]", "C) [1] \\n [2] \\n [1, 2, 3]", "D) Syntax Error"], correct: 1
        },
        {
            id: 4, topic: "Java Programming", text: "Consider the following Java code. What happens when it is compiled and run?",
            code: `try {\n    int x = 5 / 0;\n} catch (Exception e) {\n    System.out.print("Exception ");\n} catch (ArithmeticException a) {\n    System.out.print("Arithmetic ");\n}`,
            options: ["A) Prints: Exception", "B) Prints: Arithmetic", "C) Compile-time Error", "D) Runtime Error"], correct: 2
        },
        {
            id: 5, topic: "Digital Logic", text: "Identify the logic gate represented by the boolean expression Y = (A + B)'",
            options: ["A) AND Gate", "B) NAND Gate", "C) NOR Gate", "D) XOR Gate"], correct: 2
        },
        {
            id: 6, topic: "Computer Networks", text: "Which OSI Layer is responsible for handling 'Frames'?",
            options: ["A) Physical", "B) Data Link", "C) Network", "D) Transport"], correct: 1
        },
        {
            id: 7, topic: "Numerical", text: "In a /26 subnet, how many usable host IP addresses are available?",
            options: ["A) 64", "B) 62", "C) 32", "D) 30"], correct: 1
        },
        {
            id: 8, topic: "C++ Programming", text: "What does `*(ptr + 2)` do if `ptr` points to the start of an integer array?",
            options: ["A) Adds 2 to the value of the first element", "B) Accesses the memory address 2 bytes ahead", "C) Accesses the 3rd element in the array", "D) Throws a segmentation fault"], correct: 2
        },
        {
            id: 9, topic: "DBMS", text: "Which DDL command is used to add a new column to an existing table?",
            options: ["A) UPDATE", "B) ALTER", "C) MODIFY", "D) CHANGE"], correct: 1
        },
        {
            id: 10, topic: "Misc (IT Act 2000)", text: "Under the IT Act 2000, which section specifically deals with punishment for hacking?",
            options: ["A) Section 43", "B) Section 65", "C) Section 66", "D) Section 67"], correct: 2
        }
    ];

    // --- STATE MANAGEMENT ---
    let currentIndex = 0;
    let timerInterval;
    let timeRemaining;
    let answers = {}; // Maps index to selected option
    let status = new Array(questions.length).fill('notvisited'); // 'notvisited', 'unanswered', 'answered'

    function startQuiz() {
        const timeLimit = parseInt(document.getElementById('timer-select').value) * 60;
        timeRemaining = timeLimit;
        
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'grid'; // Uses CSS Grid
        
        buildPalette();
        loadQuestion(0);
        startTimer();

        window.onbeforeunload = () => "Exam in progress. Progress will be lost!";
    }

    function buildPalette() {
        const grid = document.getElementById('palette-grid');
        grid.innerHTML = '';
        questions.forEach((q, index) => {
            grid.innerHTML += `<button class="palette-btn" id="pal-${index}" onclick="jumpToQuestion(${index})">${index + 1}</button>`;
        });
    }

    function updatePaletteUI() {
        questions.forEach((q, index) => {
            const btn = document.getElementById(`pal-${index}`);
            btn.className = 'palette-btn'; // Reset
            if (status[index] !== 'notvisited') {
                btn.classList.add(status[index]);
            }
            if (index === currentIndex) {
                btn.classList.add('active');
            }
        });
    }

    function loadQuestion(index) {
        // Mark previous question as unanswered if visited but no answer chosen
        if (status[currentIndex] === 'notvisited' && answers[currentIndex] === undefined) {
            status[currentIndex] = 'unanswered';
        }
        
        currentIndex = index;
        const q = questions[index];
        
        // Mark current as visited if it was completely untouched
        if (status[index] === 'notvisited') status[index] = 'unanswered';

        document.getElementById('q-number-title').innerText = `Question ${index + 1} of ${questions.length}`;
        document.getElementById('q-topic-title').innerText = `[${q.topic}]`;

        let mediaHtml = '';
        if (q.svg) mediaHtml += `<div class="svg-container">${q.svg}</div>`;
        if (q.code) mediaHtml += `<pre><code>${q.code}</code></pre>`;
        if (q.matchTable) mediaHtml += `<table class="match-table">${q.matchTable}</table>`;

        let optionsHtml = q.options.map((opt, i) => `
            <label class="option-label" onclick="selectOption(${index}, ${i})">
                <input type="radio" name="currentQ" value="${i}" ${answers[index] === i ? 'checked' : ''}>
                ${opt}
            </label>
        `).join('');

        document.getElementById('question-content').innerHTML = `
            <div class="question-text">${q.text}</div>
            ${mediaHtml}
            <div class="options-grid">${optionsHtml}</div>
        `;

        updatePaletteUI();
    }

    function selectOption(qIndex, optIndex) {
        answers[qIndex] = optIndex;
        status[qIndex] = 'answered';
        updatePaletteUI();
    }

    function clearResponse() {
        delete answers[currentIndex];
        status[currentIndex] = 'unanswered';
        const radios = document.querySelectorAll('input[name="currentQ"]');
        radios.forEach(r => r.checked = false);
        updatePaletteUI();
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) loadQuestion(currentIndex + 1);
    }

    function prevQuestion() {
        if (currentIndex > 0) loadQuestion(currentIndex - 1);
    }

    function jumpToQuestion(index) {
        loadQuestion(index);
        // On mobile, automatically close palette after jumping
        if (window.innerWidth <= 768) {
            document.getElementById('side-panel').classList.remove('open');
        }
    }

    function toggleMobilePalette() {
        document.getElementById('side-panel').classList.toggle('open');
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            let s = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
            
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                submitQuiz();
            }
        }, 1000);
    }

    function submitQuiz() {
        if(confirm("Are you sure you want to submit the exam?")) {
            window.onbeforeunload = null;
            alert("Quiz submitted! (Analytics pipeline to be attached here based on your existing setup)");
            // Here you will paste the JSON generation logic you already have for the dashboard.
        }
    }
</script>

</body>
</html>
